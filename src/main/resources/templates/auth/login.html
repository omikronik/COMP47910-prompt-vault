<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{fragments/layout-public}"
>
  <head>
    <title>Login</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="card card-shiny">
        <h1 class="auth-title">Welcome back</h1>
        <p class="text-muted auth-subtitle">
          Sign in to your PromptVault account.
        </p>

        <div
          th:if="${success}"
          class="alert alert-success mb"
          th:text="${success}"
        ></div>
        <div
          th:if="${error}"
          class="alert alert-danger mb"
          th:text="${error}"
        ></div>

        <form method="post" th:action="@{/auth/login}" th:object="${loginRequest}">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" maxlength="255" required />
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" maxlength="64" required />
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
          </div>
          <input type="submit" value="Sign In" />
        </form>

        <p class="text-center mt small-copy">
          Don't have an account?
          <a th:href="@{/auth/register}">Register</a>
        </p>
      </div>
    </div>
  </body>
</html>
