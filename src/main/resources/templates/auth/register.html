<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{fragments/layout-public}"
>
  <head>
    <title>Register</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="card card-shiny">
        <h1 style="margin-bottom: 0.25rem">Create account</h1>

        <p class="text-muted" style="margin-bottom: 1.5rem">
          Join PromptVault to start managing your prompts.
        </p>

        <form
          method="post"
          th:action="@{/auth/register}"
          th:object="${registerRequest}"
        >
          <div
            th:if="${#fields.hasGlobalErrors()}"
            class="alert alert-danger mb"
          >
            <div
              th:each="error : ${#fields.globalErrors()}"
              th:text="${error}"
            ></div>
          </div>

          <div class="row">
            <div class="form-group w-full">
              <label for="firstName">First Name</label>

              <input
                type="text"
                id="firstName"
                th:field="*{firstName}"
                maxlength="255"
                required
              />

              <div
                class="text-danger"
                th:if="${#fields.hasErrors('firstName')}"
                th:errors="*{firstName}"
              ></div>
            </div>

            <div class="form-group w-full">
              <label for="lastName">Last Name</label>

              <input
                type="text"
                id="lastName"
                th:field="*{lastName}"
                maxlength="255"
                required
              />

              <div
                class="text-danger"
                th:if="${#fields.hasErrors('lastName')}"
                th:errors="*{lastName}"
              ></div>
            </div>
          </div>

          <div class="form-group">
            <label for="username">Username</label>

            <input
              type="text"
              id="username"
              th:field="*{username}"
              maxlength="255"
              required
            />

            <div
              class="text-danger"
              th:if="${#fields.hasErrors('username')}"
              th:errors="*{username}"
            ></div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>

            <input
              type="email"
              id="email"
              th:field="*{email}"
              maxlength="255"
              required
            />

            <div
              class="text-danger"
              th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"
            ></div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              th:field="*{password}"
              minlength="12"
              maxlength="64"
              required
            />

            <p
              class="text-muted"
              style="font-size: 0.8rem; margin-top: 0.35rem"
            >
              Use 12–64 characters with at least one uppercase letter, one
              lowercase letter, and one special character.
            </p>

            <div class="text-danger" th:if="${#fields.hasErrors('password')}">
              <div
                class="text-danger"
                th:each="error : ${#fields.errors('password')}"
                th:text="${error}"
              ></div>
            </div>
          </div>

          <input type="submit" value="Create Account" />
        </form>

        <p class="text-center mt" style="font-size: 0.9rem">
          Already have an account?
          <a th:href="@{/auth/login}">Sign in</a>
        </p>
      </div>
    </div>
  </body>
</html>
