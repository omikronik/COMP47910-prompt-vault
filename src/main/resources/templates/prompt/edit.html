<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{fragments/layout-app}"
>
  <head>
    <title>Edit Prompt</title>
  </head>

  <body>
    <div layout:fragment="content">
      <div class="page-header">
        <div>
          <h1>Edit Prompt</h1>
          <p class="text-muted">Update your saved prompt.</p>
        </div>

        <a
          class="btn btn-secondary"
          th:href="@{/prompts/{id}(id=${prompt.id})}"
        >
          Back to Prompt
        </a>
      </div>

      <div class="card">
        <form method="post" th:action="@{/prompts/{id}/edit(id=${prompt.id})}" th:object="${promptRequest}">
          <div class="form-group">
            <label for="title">Title</label>
            <input
              type="text"
              id="title"
              th:field="*{title}"
              maxlength="255"
              required
            />
            <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
          </div>

          <div class="form-group">
            <label for="content">Content</label>
            <textarea
              id="content"
              th:field="*{content}"
              maxlength="255"
              required
              data-character-counter="content-count"
            ></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
            <span
              id="content-count"
              class="text-muted char-counter"
              th:text="${255 - #strings.length(prompt.content)} + ' remaining'"
            >
              255 remaining
            </span>
          </div>

          <div class="form-group">
            <label for="categoryId">Category</label>
            <select id="categoryId" th:field="*{categoryId}">
              <option value="">-- None --</option>
              <option
                th:each="cat : ${categories}"
                th:value="${cat.id}"
                th:text="${cat.name}"
              >
                Category
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="visibility">Visibility</label>
            <select id="visibility" th:field="*{visibility}">
              <option
                value="PRIVATE"
              >
                Private
              </option>
              <option
                value="SHARED"
              >
                Shared
              </option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('visibility')}" th:errors="*{visibility}"></div>
          </div>

          <div class="row actions mt-lg">
            <input type="submit" value="Save Changes" />

            <a
              class="btn btn-secondary"
              th:href="@{/prompts/{id}(id=${prompt.id})}"
            >
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>

  </body>
</html>
